<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Memory Match ❤️</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="../css/style.css">

<style>

body{

display:flex;

justify-content:center;

align-items:center;

min-height:100vh;

}

.board{

display:grid;

grid-template-columns:repeat(4,75px);

gap:12px;

margin-top:25px;

justify-content:center;

}

.card{

width:75px;

height:75px;

display:flex;

justify-content:center;

align-items:center;

font-size:34px;

background:#ff4f93;

border-radius:15px;

cursor:pointer;

user-select:none;

transition:.3s;

}

.card.open{

background:white;

color:black;

}

.card.done{

background:#7dffb3;

color:black;

pointer-events:none;

}

</style>

</head>

<body>

<div class="container text-center">

<h1>

🧠 Memory Match

</h1>

<p>

Match all the hearts ❤️

</p>

<div class="board" id="board">

</div>

<br>

<a href="games.html" class="btn btn-pink">

⬅ Back

</a>

</div>

<script>

const emojis=[
"❤️","❤️",
"🌹","🌹",
"💖","💖",
"😍","😍",
];

let shuffled=
emojis.sort(()=>Math.random()-0.5);

let board=document.getElementById("board");

let first=null;

let second=null;

let lock=false;

shuffled.forEach(icon=>{

let div=document.createElement("div");

div.className="card";

div.dataset.icon=icon;

div.innerHTML="?";

board.appendChild(div);

div.onclick=function(){

if(lock)return;

if(div.classList.contains("done"))return;

if(div===first)return;

div.classList.add("open");

div.innerHTML=icon;

if(!first){

first=div;

return;

}

second=div;

lock=true;

if(first.dataset.icon===second.dataset.icon){

first.classList.add("done");

second.classList.add("done");

first=null;

second=null;

lock=false;

if(document.querySelectorAll(".done").length===8){

setTimeout(()=>{

alert("🎉 You matched every card!");

},300);

}

}

else{

setTimeout(()=>{

first.classList.remove("open");

second.classList.remove("open");

first.innerHTML="?";

second.innerHTML="?";

first=null;

second=null;

lock=false;

},700);

}

};

});

</script>

</body>

</html>
